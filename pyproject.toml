[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-ensemble"
version = "0.1.0"
description = "WASH: removing LLM watermarks via multi-model ensemble generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "numpy>=1.24",
    "scipy>=1.10",
    "nltk>=3.8",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["watermark_ensemble*"]
